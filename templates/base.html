<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block title %}Roster{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'><rect x='1' y='1' width='22' height='22' rx='6' fill='%232F6FD8'/><g fill='%23fff'><rect x='5' y='5' width='4' height='4' rx='1'/><rect x='10' y='5' width='4' height='4' rx='1'/><rect x='15' y='5' width='4' height='4' rx='1' opacity='.35'/><rect x='5' y='10' width='4' height='4' rx='1'/><rect x='10' y='10' width='4' height='4' rx='1' opacity='.35'/><rect x='15' y='10' width='4' height='4' rx='1'/><rect x='5' y='15' width='4' height='4' rx='1' opacity='.35'/><rect x='10' y='15' width='4' height='4' rx='1'/><rect x='15' y='15' width='4' height='4' rx='1'/></g></svg>">
<style>
:root {
  --bg: #F7F6F5; --paper: #FFFFFF; --ink: #1C1917; --muted: #6D6B68; --line: #E6E4E0; --empty: #EDECEA;
  --signal: #4D85E1; --signal-soft: #EBF0F9; --sheen: linear-gradient(180deg, #5E93EA, #4479DA);
  --timing: #9A5B0B; --defend: #B4321F; --good: #1F7A4D;
  --lift: 0 1px 2px rgb(28 25 23 / .05), 0 2px 8px rgb(28 25 23 / .04); --shadow: 0 0 0 1px var(--line), var(--lift);
  --r-ctl: 8px; --r-panel: 14px;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--signal); text-underline-offset: 3px; }
h1 { font-size: 24px; line-height: 1.2; letter-spacing: -0.01em; font-weight: 600; margin: 4px 0 6px; }
h2 { font-size: 17px; font-weight: 600; margin: 32px 0 12px; }
h2 .n { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 6px; }
h3 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; padding: 0 10px 12px; }
.brand { display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 4px; margin-bottom: 8px; color: var(--ink); text-decoration: none;
         font-weight: 600; font-size: 18px; letter-spacing: -0.02em; }
.brand svg { width: 26px; height: 26px; flex: none; }
.side a.item { display: block; padding: 6px 10px; border-radius: var(--r-ctl); color: var(--ink); text-decoration: none; font-weight: 500; }
.side a.item:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.side a.item.on { background: var(--paper); font-weight: 600; box-shadow: var(--shadow); }
.side .group { margin: 12px -10px 4px; padding: 12px 20px 2px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.page { min-width: 0; margin: 8px 8px 8px 0; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-panel); box-shadow: var(--lift); }
main { padding: 26px 32px 72px; max-width: 1480px; margin: 0 auto; }
button, .btn { font-size: 13px; line-height: 20px; font-weight: 500; padding: 5px 12px; border: 1px solid var(--line); border-radius: var(--r-ctl);
               background: var(--paper); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; white-space: nowrap; }
button:hover, .btn:hover { background: color-mix(in srgb, var(--ink) 4%, var(--paper)); }
button.primary { background: var(--sheen); color: #fff; border-color: var(--signal); }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 3px 8px; }
button.ghost:hover { color: var(--ink); border-color: var(--line); }
input, select { padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--paper); font-size: 13px; }
input[type=checkbox] { width: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--paper); }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-weight: 500; font-size: 12px; color: var(--muted); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.tag { font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; background: var(--signal-soft); white-space: nowrap; }
.tag.bad { background: color-mix(in srgb, var(--defend) 13%, var(--paper)); color: color-mix(in srgb, var(--defend) 80%, var(--ink)); }
.tag.warn { background: color-mix(in srgb, var(--timing) 14%, var(--paper)); color: color-mix(in srgb, var(--timing) 75%, var(--ink)); }
.tag.ok { background: color-mix(in srgb, var(--good) 13%, var(--paper)); color: color-mix(in srgb, var(--good) 85%, var(--ink)); }
.tag.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 400; }
.pane { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-panel); box-shadow: var(--lift); overflow: hidden; }
.pane > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.pane > header h3 { margin: 0; font-size: 15px; }
.pane .in { padding: 14px 16px; }
.scroll { overflow-x: auto; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0; }
.stats > div { padding: 12px 16px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-panel); box-shadow: var(--lift); }
.stats strong { display: block; font-size: 24px; font-weight: 600; }
.stats span { font-size: 13px; color: var(--muted); }
.flash { background: var(--signal-soft); border-radius: var(--r-ctl); padding: 10px 14px; margin: 12px 0; max-width: 90ch; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
form.inline { display: inline; }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; } .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; } .side .group { display: none; } .page { margin: 0; } main { padding: 18px 14px 48px; } }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="app">
  <nav class="side">
    <a class="brand" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" fill="#2F6FD8"/><g fill="#fff"><rect x="5" y="5" width="4" height="4" rx="1"/><rect x="10" y="5" width="4" height="4" rx="1"/><rect x="15" y="5" width="4" height="4" rx="1" opacity=".35"/><rect x="5" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1" opacity=".35"/><rect x="15" y="10" width="4" height="4" rx="1"/><rect x="5" y="15" width="4" height="4" rx="1" opacity=".35"/><rect x="10" y="15" width="4" height="4" rx="1"/><rect x="15" y="15" width="4" height="4" rx="1"/></g></svg>Roster</a>
    <a class="item{{ ' on' if here == 'roster' }}" href="/roster">Monthly roster</a>
    <div class="group">Setup</div>
    {% for key, (label, _) in tables.items() %}<a class="item{{ ' on' if here == key }}" href="/setup/{{ key }}">{{ label }}</a>{% endfor %}
  </nav>
  <div class="page"><main>{% block main %}{% endblock %}</main></div>
</div>
</body>
</html>
